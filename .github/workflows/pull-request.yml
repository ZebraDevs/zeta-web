name: CI - Pull Request
# Runs on `pull_request` (not `pull_request_target`): this workflow checks out and executes PR code, which must
# never happen with the elevated token/secrets of `pull_request_target`.
# Same-repo PRs get a write token + secrets; fork PRs get a read-only token, so jobs that write or deploy are skipped.
on: pull_request

permissions:
  contents: write # generate-localizations / code-quality push fixes to the PR branch
  pull-requests: write # code-quality comments on the PR

# Pull Request Runs on the same branch will be cancelled
concurrency:
  group: ${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  generate-localizations:
    name: Generate localizations.
    # Needs to push to the PR branch, which fork PRs can't do. Dependent jobs below are skipped / adapt accordingly.
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: "yarn" Removed due to https://github.com/actions/setup-node/issues/1027

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run lit-localize extract
        run: yarn run localize:extract

      - name: Run lit-localize build
        run: yarn run localize:build

      - name: Format code
        run: npx prettier src --write --ignore-unknown

      - name: Run test-count
        run: yarn test:count

      - name: Check diff
        id: diff
        run: git diff --quiet --ignore-all-space . || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit files
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add .
          git commit -m "Generated locales"
          git push

  code-quality:
    name: Check the code quality
    needs: [generate-localizations]
    # generate-localizations is skipped for fork PRs; still run quality checks there.
    if: ${{ !cancelled() && needs.generate-localizations.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Same-repo: check out the branch so fixes can be pushed. Fork: default (merge commit), nothing is pushed.
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # - name: Setup node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      # cache: "yarn" Removed due to https://github.com/actions/setup-node/issues/1027
      - name: Install dependencies
        run: yarn install --immutable

      - name: Code Quality
        uses: ZebraDevs/web-components-code-quality@a9ead66559ba1d72fdc71f0112f97082d6f2725b
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fork PRs have a read-only token: no pushing fixes or commenting.
          run-code-formatting: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          create-comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          test-results-path: "src/test/test-results.xml"
          eslint-config-path: "src/eslint.config.mjs"
          test-config-path: "src/test/web-test-runner.config.js"
          lit-analyzer-cmd: "npx lit-analyzer src/components/**/* src/stories/**/* src/mixins/**/* src/test/**/* src/utils/**/* --quiet --format markdown"

  deploy-preview:
    timeout-minutes: 20
    name: Deploy preview version of the storybook on firebase
    # Skipped for fork PRs (no secrets) because generate-localizations is skipped.
    needs: [generate-localizations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: "yarn" Removed due to https://github.com/actions/setup-node/issues/1027

      - name: Install dependencies
        run: yarn install --immutable

      - name: Create custom-elements.json
        run: yarn run analyze

      - name: Build storybook
        run: yarn run storybook:build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZETA_DS }}"
          expires: 7d
          channelId: "pr-${{ github.event.number }}-${{ github.event.pull_request.head.ref }}"
