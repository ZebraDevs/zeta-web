name: CI - Pull Request
on: pull_request

# Pull Request Runs on the same branch will be cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  generate-localizations:
    name: Generate localizations.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "^26.12.1"
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate files
        run: yarn generate

      # Bot commits pushed with GITHUB_TOKEN don't trigger CI, so required checks would never report on them
      - name: Check generated files are committed
        run: |
          git add -A
          if ! git diff --cached --quiet --ignore-all-space; then
            git diff --cached --stat
            echo "::error::Generated files are out of date. Run 'yarn generate' and commit the result."
            exit 1
          fi

  code-quality:
    name: Check the code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # results comment
    steps:
      # No persisted credentials: if formatting changes files, the action's push fails and so does this check
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "^26.12.1"
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Code Quality
        uses: ZebraDevs/web-components-code-quality@a9ead66559ba1d72fdc71f0112f97082d6f2725b
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          test-results-path: "src/test/test-results.xml"
          eslint-config-path: "src/eslint.config.mjs"
          test-config-path: "src/test/web-test-runner.config.js"
          lit-analyzer-cmd: "npx lit-analyzer src/components/**/* src/stories/**/* src/mixins/**/* src/test/**/* src/utils/**/* --quiet --format markdown"

  deploy-preview:
    timeout-minutes: 20
    name: Deploy preview version of the storybook on firebase
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write # preview URL comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "^26.12.1"
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Create custom-elements.json
        run: yarn run analyze

      - name: Build storybook
        run: yarn run storybook:build

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZETA_DS }}"
          expires: 7d
          channelId: "pr-${{ github.event.number }}-${{ github.event.pull_request.head.ref }}"
