name: Update Zeta Icons

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-icons]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] create-pull-request pushes

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "^26.12.1"
          cache: yarn

      - name: Update Zeta Icons
        run: yarn add @zebra-fed/zeta-icons@latest # zizmor: ignore[adhoc-packages] the point of this workflow

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "deps: Update zeta-icons library"
          branch: "update-zeta-icons"
          base: "main"
          delete-branch: true
          title: "deps: Update zeta-icons library"
          labels: "icons"
