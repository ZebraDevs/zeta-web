name: CI - On Release

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'zebratechnologies',
              repo: 'design.zebra.com',
              workflow_id: 'deploy.yml',
              ref: 'main', 
              inputs:{
                package_to_update: 'zeta-web',
              }
            })

  publish-web:
    environment: npmjs.com
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "^26.12.1"
          package-manager-cache: false # never restore caches into the publish job

      - name: Install packages
        run: yarn install --immutable

      - name: Compile Typescript files
        run: yarn run build

      - name: Publish
        run: yarn npm publish --provenance
